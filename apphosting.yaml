# Firebase App Hosting 설정 (main 에 머지되면 자동 배포)
# NEXT_PUBLIC_FIREBASE_* 는 브라우저에 노출되는 공개 설정값이라 커밋해도 된다. 시크릿은 여기에 값으로 두지 말고 secret 으로 등록한다.

runConfig:
  # 학교 프로젝트 규모: 요청 없으면 0대, 최대 2대로 비용 상한
  minInstances: 0
  maxInstances: 2

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBFo04hNOlhxExDKjeI86-hnK_4z7nUAIw"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "teamkit-8c6d5.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "teamkit-8c6d5"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "teamkit-8c6d5.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "340034633979"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:340034633979:web:513d2cc3caab05789b705e"
    availability:
      - BUILD
      - RUNTIME

  # GitHub 웹훅이 보낼 주소 (서버에서 웹훅 만들 때 사용)
  - variable: PUBLIC_APP_URL
    value: "https://teamkit--teamkit-8c6d5.asia-east1.hosted.app"
    availability:
      - RUNTIME
